<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="84%">
      <stop offset="0%"   stop-color="#282833"/>
      <stop offset="42%"  stop-color="#16161D"/>
      <stop offset="100%" stop-color="#07070A"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="66%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.60"/>
    </radialGradient>
    <radialGradient id="aura" gradientUnits="userSpaceOnUse" cx="512" cy="500" r="400">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="46%"  stop-color="#CBD2E2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#CBD2E2" stop-opacity="0"/>
    </radialGradient>
    <!-- a lit solid, not an emitter: brightest along the top, falling away -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="286" x2="0" y2="742">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="42%"  stop-color="#F2F5FA"/>
      <stop offset="100%" stop-color="#CBD2E0"/>
    </linearGradient>
    <filter id="contact" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/></filter>
    <filter id="edgeSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/></filter>

    <!-- a band hugging the top edge: the shape minus itself pushed down -->
    <mask id="topEdge">
      <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#FFFFFF" /><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#FFFFFF" /><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#FFFFFF" />
      <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#000000" transform="translate(0,8)"/><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#000000" transform="translate(0,8)"/><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#000000" transform="translate(0,8)"/>
    </mask>
    <!-- and the mirror of it along the bottom -->
    <mask id="botEdge">
      <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#FFFFFF" /><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#FFFFFF" /><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#FFFFFF" />
      <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#000000" transform="translate(0,-10)"/><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#000000" transform="translate(0,-10)"/><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#000000" transform="translate(0,-10)"/>
    </mask>
    <mask id="body"><path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#FFFFFF" /><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#FFFFFF" /><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#FFFFFF" /></mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vign)"/>
  <circle cx="512" cy="500" r="400" fill="url(#aura)"/>

  <!-- tight contact glow, under the crisp shape so the corners stay corners -->
  <g filter="url(#contact)" opacity="0.42">
    <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="#B8C0D2" /><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="#B8C0D2" /><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="#B8C0D2" />
  </g>

  <path d="M296.0 300.0 L396.0 300.0 L396.0 358.0 L354.0 358.0 L354.0 642.0 L396.0 642.0 L396.0 700.0 L296.0 700.0 Z" fill="url(#body)" /><path d="M728.0 300.0 L628.0 300.0 L628.0 358.0 L670.0 358.0 L670.0 642.0 L628.0 642.0 L628.0 700.0 L728.0 700.0 Z" fill="url(#body)" /><path d="M460.0 500.0 A52.0 52.0 0 1 0 564.0 500.0 A52.0 52.0 0 1 0 460.0 500.0 Z" fill="url(#body)" />

  <g filter="url(#edgeSoft)">
    <rect width="1024" height="1024" fill="#FFFFFF" mask="url(#topEdge)" opacity="0.85"/>
    <rect width="1024" height="1024" fill="#7A8296" mask="url(#botEdge)" opacity="0.26"/>
  </g>
</svg>
