    </mask>
    <mask id="body"><path d="M381.0 588.8 L636.7 575.4 Q696.6 572.2 699.7 632.2 L699.7 632.2 Q702.9 692.1 643.0 695.2 L387.3 708.6 Q327.4 711.8 324.3 651.8 L324.3 651.8 Q321.1 591.9 381.0 588.8 Z" fill="#FFFFFF" /><path d="M439.6 432.1 L593.2 444.2 Q649.0 448.6 644.6 504.4 L644.6 504.4 Q640.2 560.3 584.4 555.9 L430.8 543.8 Q375.0 539.4 379.4 483.6 L379.4 483.6 Q383.8 427.7 439.6 432.1 Z" fill="#FFFFFF" /><path d="M496.1 286.6 L522.1 285.5 Q588.0 282.6 590.9 348.6 L590.9 348.6 Q593.8 414.5 527.9 417.4 L501.9 418.5 Q436.0 421.4 433.1 355.4 L433.1 355.4 Q430.2 289.5 496.1 286.6 Z" fill="#FFFFFF" /></mask>
