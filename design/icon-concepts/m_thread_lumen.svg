<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="84%">
      <stop offset="0%"   stop-color="#282833"/>
      <stop offset="42%"  stop-color="#16161D"/>
      <stop offset="100%" stop-color="#07070A"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="66%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.60"/>
    </radialGradient>
    <radialGradient id="coreBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="64%"  stop-color="#DFE4EF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#CBD2E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="haloWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/></filter>
    <filter id="haloTight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/></filter>
    <filter id="coreglow" x="-220%" y="-220%" width="540%" height="540%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <radialGradient id="lum" gradientUnits="userSpaceOnUse" cx="512.0" cy="545.0" r="340">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="24%"  stop-color="#FBFCFE"/>
      <stop offset="60%"  stop-color="#E6EAF2"/>
      <stop offset="100%" stop-color="#C4CBDA"/>
    </radialGradient>
    <radialGradient id="aura" gradientUnits="userSpaceOnUse" cx="512.0" cy="545.0" r="380">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="42%"  stop-color="#CBD2E2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#CBD2E2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#vign)"/>
  <circle cx="512.0" cy="545.0" r="380" fill="url(#aura)"/>

  <path d="M320.0 704.0 L320.0 300.0 C393.0 737.3 631.0 737.3 704.0 300.0 L704.0 704.0" fill="none" stroke="#E8ECF5" stroke-width="74" stroke-linecap="round" stroke-linejoin="round" filter="url(#haloWide)" opacity="0.30"/>
  <path d="M320.0 704.0 L320.0 300.0 C393.0 737.3 631.0 737.3 704.0 300.0 L704.0 704.0" fill="none" stroke="#F2F5FA" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" filter="url(#haloTight)" opacity="0.42"/>
  <path d="M320.0 704.0 L320.0 300.0 C393.0 737.3 631.0 737.3 704.0 300.0 L704.0 704.0" fill="none" stroke="url(#lum)" stroke-width="58.0" stroke-linecap="round" stroke-linejoin="round" />

  <g filter="url(#coreglow)">
    <circle cx="512.0" cy="628.0" r="52" fill="url(#coreBloom)"/>
    <circle cx="512.0" cy="628.0" r="14" fill="#FFFFFF"/>
  </g>
</svg>
