<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stone" x1="10%" y1="0%" x2="28%" y2="100%">
      <stop offset="0%"   stop-color="#FCFBF8"/>
      <stop offset="48%"  stop-color="#F2F0EA"/>
      <stop offset="100%" stop-color="#DEDBD2"/>
    </linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
    <linearGradient id="cut" gradientUnits="userSpaceOnUse" x1="0" y1="286" x2="0" y2="742">
      <stop offset="0%"   stop-color="#212127"/>
      <stop offset="55%"  stop-color="#2B2B33"/>
      <stop offset="100%" stop-color="#40404B"/>
    </linearGradient>
    <radialGradient id="lift" cx="42%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="62%"  stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign4" cx="50%" cy="44%" r="74%">
      <stop offset="0%"   stop-color="#75705F" stop-opacity="0"/>
      <stop offset="58%"  stop-color="#75705F" stop-opacity="0"/>
      <stop offset="100%" stop-color="#75705F" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="ao" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/></filter>
    <filter id="edgeSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/></filter>

    <!-- a band hugging the top edge: the shape minus itself pushed down -->
    <mask id="topEdge">
      <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#FFFFFF" /><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#FFFFFF" /><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#FFFFFF" /><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#FFFFFF" /><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#FFFFFF" /><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#FFFFFF" />
      <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#000000" transform="translate(0,9)"/><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#000000" transform="translate(0,9)"/><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#000000" transform="translate(0,9)"/><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#000000" transform="translate(0,9)"/><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#000000" transform="translate(0,9)"/><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#000000" transform="translate(0,9)"/>
    </mask>
    <!-- and the mirror of it along the bottom -->
    <mask id="botEdge">
      <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#FFFFFF" /><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#FFFFFF" /><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#FFFFFF" /><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#FFFFFF" /><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#FFFFFF" /><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#FFFFFF" />
      <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#000000" transform="translate(0,-11)"/><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#000000" transform="translate(0,-11)"/><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#000000" transform="translate(0,-11)"/><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#000000" transform="translate(0,-11)"/><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#000000" transform="translate(0,-11)"/><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#000000" transform="translate(0,-11)"/>
    </mask>
    <mask id="body"><path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#FFFFFF" /><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#FFFFFF" /><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#FFFFFF" /><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#FFFFFF" /><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#FFFFFF" /><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#FFFFFF" /></mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#stone)"/>
  <rect width="1024" height="1024" fill="url(#lift)"/>
  <rect width="1024" height="1024" filter="url(#grain)" fill="#8B877C" opacity="0.28"/>

  <!-- the stone's lower lip, raised into the light just past the cut -->
  <g filter="url(#edgeSoft)" opacity="0.8">
    <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#FFFFFF" transform="translate(0,9)"/><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#FFFFFF" transform="translate(0,9)"/><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#FFFFFF" transform="translate(0,9)"/><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#FFFFFF" transform="translate(0,9)"/><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#FFFFFF" transform="translate(0,9)"/><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#FFFFFF" transform="translate(0,9)"/>
  </g>
  <g filter="url(#ao)" opacity="0.12">
    <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="#5C5849" transform="translate(0,4)"/><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="#5C5849" transform="translate(0,4)"/><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="#5C5849" transform="translate(0,4)"/><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="#5C5849" transform="translate(0,4)"/><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="#5C5849" transform="translate(0,4)"/><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="#5C5849" transform="translate(0,4)"/>
  </g>

  <path d="M615.9 504.5 L779.8 616.4 A292.0 292.0 0 0 1 570.2 786.1 L567.9 587.7 Z" fill="url(#cut)" /><path d="M560.0 592.2 L545.1 790.1 A292.0 292.0 0 0 1 293.3 693.5 L464.0 592.2 Z" fill="url(#cut)" /><path d="M456.1 587.7 L277.3 673.7 A292.0 292.0 0 0 1 235.1 407.3 L408.1 504.5 Z" fill="url(#cut)" /><path d="M408.1 495.5 L244.2 383.6 A292.0 292.0 0 0 1 453.8 213.9 L456.1 412.3 Z" fill="url(#cut)" /><path d="M464.0 407.8 L478.9 209.9 A292.0 292.0 0 0 1 730.7 306.5 L560.0 407.8 Z" fill="url(#cut)" /><path d="M567.9 412.3 L746.7 326.3 A292.0 292.0 0 0 1 788.9 592.7 L615.9 495.5 Z" fill="url(#cut)" />

  <!-- shadow banked against the upper wall, light grazing the lower one -->
  <g filter="url(#edgeSoft)">
    <rect width="1024" height="1024" fill="#111116" mask="url(#topEdge)" opacity="0.72"/>
    <rect width="1024" height="1024" fill="#8E8B9C" mask="url(#botEdge)" opacity="0.34"/>
  </g>
</svg>
