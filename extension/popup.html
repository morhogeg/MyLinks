<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machina settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="288 292 448 416" width="24" height="24" fill="#ffffff">
          <path d="M296 300 L396 300 L396 358 L354 358 L354 642 L396 642 L396 700 L296 700 Z" />
          <path d="M728 300 L628 300 L628 358 L670 358 L670 642 L628 642 L628 700 L728 700 Z" />
          <circle cx="512" cy="500" r="52" />
        </svg>
      </div>
      <div class="titles">
        <h1>Machina</h1>
        <p class="sub">Save to Machina</p>
      </div>
    </header>

    <div id="conn" class="conn hidden" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="connText"></span>
    </div>

    <div id="banner" class="banner hidden"></div>

    <section class="field">
      <label for="token">Ingest token</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false"
             placeholder="Paste your Machina token" />
      <button id="reveal" type="button" class="link-btn">Show</button>
      <p class="hint">Find it in Machina: Settings, then Browser extension.</p>
    </section>

    <section class="field">
      <label for="baseUrl">Backend URL <span class="opt">(optional)</span></label>
      <input id="baseUrl" type="text" autocomplete="off" spellcheck="false"
             placeholder="https://secondbrain-app-94da2.web.app" />
    </section>

    <div class="actions">
      <button id="save" type="button" class="primary">Save and connect</button>
    </div>

    <div class="divider"></div>

    <button id="saveTab" type="button" class="wide">Save this page now</button>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
