<title>Machina in Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a screening room. The film at its own shape, a slate line above
     it, its chapters with their real timecodes under it (beside it, for the
     9:16 cut on a wide screen). Paper and ink are the film's own, so a frame
     meets the page without a seam in the light theme. */
  :root {
    --paper: #EEF0F4;
    --paper-hi: #F9FAFB;
    --ink: #161A22;
    --ink-soft: #5B6270;
    --rule: #D5D9E1;
    --shadow: rgba(17, 24, 39, 0.22);
    --display: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --body: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --gutter: max(16px, 4vw);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0D0F13; --paper-hi: #181B22; --ink: #ECEEF2; --ink-soft: #9AA1AE;
      --rule: #2A2E37; --shadow: rgba(0, 0, 0, 0.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0D0F13; --paper-hi: #181B22; --ink: #ECEEF2; --ink-soft: #9AA1AE;
    --rule: #2A2E37; --shadow: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .room {
    box-sizing: border-box;
    padding-inline: var(--gutter);
    padding-block: clamp(20px, 4vh, 44px);
    display: flex;
    justify-content: center;
  }

  /* the film's width follows the window, so the whole room fits one screen */
  .sheet {
    --screen-w: min(100vw - 2 * var(--gutter), max(18rem, min(1280px, (100vh - 18rem) * 16 / 9)));
    --sheet-w: var(--screen-w);
    width: var(--sheet-w);
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.4vh, 24px);
  }
  @supports (height: 100svh) {
    .sheet { --screen-w: min(100vw - 2 * var(--gutter), max(18rem, min(1280px, (100svh - 18rem) * 16 / 9))); }
  }
  .sheet[data-cut="portrait"] { --screen-w: min(100vw - 2 * var(--gutter), max(15rem, (100vh - 14rem) * 9 / 16)); }
  @supports (height: 100svh) {
    .sheet[data-cut="portrait"] { --screen-w: min(100vw - 2 * var(--gutter), max(15rem, (100svh - 14rem) * 9 / 16)); }
  }

  .slate {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;
  }
  .slate .titles { min-width: 0; }
  h1 {
    margin: 0;
    font: 600 clamp(1.45rem, 1.05rem + 1.5vw, 2.1rem)/1.1 var(--display);
    letter-spacing: -0.025em;
    text-wrap: balance;
  }
  .meta {
    margin: 6px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0 10px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .meta .num { font: 400 13px/1.6 var(--mono); font-variant-numeric: tabular-nums; }

  .cut {
    display: inline-flex;
    padding: 3px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: var(--paper);
  }
  .cut button {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 6px 14px;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font: 500 13px/1.2 var(--mono);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .cut button[aria-pressed="true"] {
    background: var(--paper-hi);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--rule), 0 1px 2px var(--shadow);
  }

  .stage { display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 22px); }
  .screen {
    width: var(--screen-w);
    max-width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 0 0 1px var(--rule), 0 34px 70px -44px var(--shadow);
  }
  .sheet[data-cut="portrait"] .screen { aspect-ratio: 9 / 16; border-radius: 18px; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: transparent; }

  /* chapters: the film's real sequence, in order, with where each starts */
  .chapters ol {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 14px;
  }
  @media (min-width: 640px) {
    .chapters ol { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  .chapters button {
    appearance: none;
    width: 100%;
    margin: 0;
    padding: 9px 0 0;
    border: 0;
    border-top: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: color 160ms ease, border-color 160ms ease;
  }
  .chapters .tc { font: 400 12px/1.4 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .chapters .nm { font: 500 15px/1.3 var(--body); }
  .chapters button:hover { color: var(--ink); }
  .chapters button[aria-current="true"] { color: var(--ink); border-top: 2px solid var(--ink); padding-top: 8px; }

  /* 9:16 on a wide screen: the chapters run down beside the film */
  @media (min-width: 720px) {
    .sheet[data-cut="portrait"] { --sheet-w: calc(var(--screen-w) + 2.5rem + 12rem); }
    .sheet[data-cut="portrait"] .stage { flex-direction: row; align-items: flex-start; gap: 2.5rem; }
    .sheet[data-cut="portrait"] .chapters { width: 12rem; flex: none; }
    .sheet[data-cut="portrait"] .chapters ol { grid-template-columns: 1fr; gap: 0; }
    .sheet[data-cut="portrait"] .chapters button {
      flex-direction: row;
      align-items: baseline;
      gap: 14px;
      padding: 11px 0 11px 14px;
      border-top: 0;
      border-left: 1px solid var(--rule);
    }
    .sheet[data-cut="portrait"] .chapters button[aria-current="true"] { border-top: 0; border-left: 2px solid var(--ink); padding: 11px 0 11px 13px; }
  }

  .note { margin: 0; color: var(--ink-soft); font-size: 13.5px; max-width: 62ch; }
  .fail { margin: 0; color: var(--ink); font-weight: 500; }

  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<main class="room">
  <div class="sheet" id="sheet" data-cut="landscape">
    <header class="slate">
      <div class="titles">
        <h1>Machina in Motion</h1>
        <p class="meta"><span>The real app, in one continuous take</span><span class="num">__DURATION__ · 1080p · 60 fps</span></p>
      </div>
      <div class="cut" role="group" aria-label="Shape of the film">
        <button type="button" id="cut-landscape" data-cut="landscape" aria-pressed="true" aria-label="Landscape, 16:9">16:9</button>
        <button type="button" id="cut-portrait" data-cut="portrait" aria-pressed="false" aria-label="Portrait, 9:16">9:16</button>
      </div>
    </header>

    <section class="stage">
      <div class="screen">
        <video id="film" controls playsinline preload="metadata" poster="poster-landscape.jpg">
          <source id="src-mp4" src="film-landscape.mp4" type='video/mp4; codecs="avc1.640032, mp4a.40.2"'>
          <source id="src-webm" src="film-landscape.webm" type='video/webm; codecs="vp9, opus"'>
        </video>
      </div>
      <nav class="chapters" aria-label="Chapters">
        <ol id="chapters">
<!-- chapters -->
        </ol>
      </nav>
    </section>

    <p class="fail" id="fail" hidden>This browser can’t play the film. It plays in Safari, Chrome, Edge and Firefox.</p>
    <p class="note">Every screen is the shipped Machina app, captured frame by frame. Sound plays when you press play.</p>
  </div>
</main>

<script>
  (() => {
    const video = document.getElementById('film');
    const sheet = document.getElementById('sheet');
    const mp4 = document.getElementById('src-mp4');
    const webm = document.getElementById('src-webm');
    const fail = document.getElementById('fail');
    const cuts = [...document.querySelectorAll('.cut button')];
    const chapters = [...document.querySelectorAll('#chapters button')].map((el) => ({ el, t: Number(el.dataset.t), name: el.id.replace('chapter-', '') }));

    // seek once the video knows its length (iOS loads nothing before play)
    const seek = (t) => {
      if (video.readyState >= 1) video.currentTime = t;
      else video.addEventListener('loadedmetadata', () => { video.currentTime = t; }, { once: true });
    };

    const mark = () => {
      let on = chapters[0];
      for (const ch of chapters) if (video.currentTime + 0.05 >= ch.t) on = ch;
      for (const ch of chapters) {
        if (ch === on) ch.el.setAttribute('aria-current', 'true');
        else ch.el.removeAttribute('aria-current');
      }
    };

    const setCut = (cut) => {
      if (sheet.dataset.cut === cut) return;
      const t = video.currentTime || 0;
      const playing = !video.paused && !video.ended;
      sheet.dataset.cut = cut;
      for (const b of cuts) b.setAttribute('aria-pressed', String(b.dataset.cut === cut));
      fail.hidden = true;
      video.poster = `poster-${cut}.jpg`;
      mp4.src = `film-${cut}.mp4`;
      webm.src = `film-${cut}.webm`;
      video.load();
      if (t > 0) seek(t);
      if (playing) video.play().catch(() => {});
      try { localStorage.setItem('machina-film-cut', cut); } catch (e) { /* storage blocked: the choice lasts this visit */ }
    };

    for (const b of cuts) b.addEventListener('click', () => setCut(b.dataset.cut));
    for (const ch of chapters) {
      ch.el.addEventListener('click', () => {
        seek(ch.t);
        video.play().catch(() => {});
      });
    }
    video.addEventListener('timeupdate', mark);
    video.addEventListener('seeked', mark);
    // the last source failing means no source played
    webm.addEventListener('error', () => { fail.hidden = false; });

    // which cut: a #portrait or #landscape link, then the viewer's last choice,
    // then the window's shape
    const hash = location.hash.slice(1).toLowerCase();
    let cut = null;
    if (hash === 'portrait' || hash === 'landscape') cut = hash;
    if (!cut) { try { cut = localStorage.getItem('machina-film-cut'); } catch (e) { cut = null; } }
    if (cut !== 'portrait' && cut !== 'landscape') cut = innerHeight > innerWidth ? 'portrait' : 'landscape';
    setCut(cut);

    // a #save, #find, #ask, #connect or #revisit link opens at that chapter
    const start = chapters.find((ch) => ch.name === hash);
    if (start) seek(start.t);
    mark();
  })();
</script>
