name: Python tests

# Backend unit tests for the Cloud Functions (functions/tests). These run
# offline — no Firestore, no network, no GEMINI key — so they need only the
# installed dependencies and plain pytest.
on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/python-tests.yml"

# Least-privilege token: no workflow here uses GITHUB_TOKEN (Firebase/Apple
# auth via their own secrets), so the default write-scoped token is pure
# exposure if a third-party action were ever compromised.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r functions/requirements.txt -r functions/requirements-dev.txt

      - name: Run tests
        run: pytest functions/tests -q
