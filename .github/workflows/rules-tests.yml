name: Firestore rules tests

# Emulator tests for the locked Firestore ruleset (firestore.rules.locked),
# exercised through @firebase/rules-unit-testing against the local Firestore
# emulator. The emulator is a Java JAR that firebase-tools downloads on first
# run, so the runner needs Node (for the test suite + firebase CLI) and a JDK.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules*"
      - "firestore-rules-test/**"
      - ".github/workflows/rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules*"
      - "firestore-rules-test/**"
      - ".github/workflows/rules-tests.yml"

# Least-privilege token: no workflow here uses GITHUB_TOKEN (Firebase/Apple
# auth via their own secrets), so the default write-scoped token is pure
# exposure if a third-party action were ever compromised.
permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firestore-rules-test/package-lock.json

      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: firestore-rules-test
        run: npm ci

      - name: Run rules tests
        working-directory: firestore-rules-test
        run: npm test
